[project]
name = "livepeer-open-clearinghouse"
version = "0.1.0"
description = "Non-custodial-by-design payment clearinghouse for Livepeer applications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "Livepeer Open Clearinghouse contributors" }]
keywords = ["livepeer", "payments", "clearinghouse"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Private :: Do Not Upload",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "authlib>=1.3.2",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "grpcio>=1.68",
    "protobuf>=5.29",
    "apscheduler>=3.11",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "resend>=2.4",
]

[project.urls]
Homepage = "https://github.com/livepeer/livepeer-open-clearinghouse"

[project.scripts]
livepeer_open_clearinghouse = "livepeer_open_clearinghouse.main:cli"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-protobuf>=5.29",
    "grpcio-tools>=1.68",
    "pre-commit>=4.0",
    "eth-account>=0.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livepeer_open_clearinghouse"]

[tool.uv]
required-version = ">=0.5"
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# ruff: lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/versions", "src/livepeer_open_clearinghouse/_gen"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # bugbear
    "UP",          # pyupgrade
    "SIM",         # simplify
    "RUF",         # ruff-specific
    "ASYNC",       # async best practices
    "S",           # bandit (security)
    "TID",         # tidy imports
    "PL",          # pylint subset
    "PT",          # pytest style
]
ignore = [
    "PLR0913",     # too many arguments — domains/services legitimately take many providers
    "S101",        # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict types
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["resend.*", "apscheduler.*", "grpc.*", "grpc_tools.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (no I/O)",
    "integration: integration tests (real Postgres, daemon mocks)",
    "e2e: end-to-end tests against the full docker compose stack",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google._upb._message",
]

[tool.coverage.run]
source = ["src/livepeer_open_clearinghouse"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
