[project]
name = "livepeer-open-clearinghouse-sdk"
version = "1.3.3"
description = "Reference Python SDK for the Livepeer Open Clearinghouse payment clearinghouse."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "datamodel-code-generator>=0.28",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=6",
  "respx>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livepeer_open_clearinghouse_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--cov=livepeer_open_clearinghouse_sdk",
  "--cov-report=term-missing",
  "--cov-report=html:.coverage_html",
  # 75% matches the documented threshold on the Go and Rust SDKs;
  # see docs/exec-plans/active/002-long-running-sessions.md
  # §"SDK conformance criteria for telemetry".
  "--cov-fail-under=75",
]

[tool.coverage.run]
branch = true
source = ["src/livepeer_open_clearinghouse_sdk"]
omit = ["src/livepeer_open_clearinghouse_sdk/_generated.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/livepeer_open_clearinghouse_sdk/_generated.py"]

[tool.ruff.lint]
# Boring strict baseline. E/F = pyflakes + pycodestyle, I = isort, B =
# bugbear, UP = pyupgrade, RUF = ruff-native, SIM = simplify, ASYNC =
# anti-pattern checks for async code, ANN = annotations.
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "ASYNC"]
ignore = [
  "E501",   # line length — formatter handles it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]   # assert allowed in tests

[tool.ruff.format]
quote-style = "double"
