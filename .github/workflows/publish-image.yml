name: Publish image

# Build and push tztcloud/livepeer-open-clearinghouse-gateway when a v* tag is pushed.
#
# Secrets required (set in the repo's Actions secrets):
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN     (read-write token, not your account password)
#
# Tags pushed:
#   tztcloud/livepeer-open-clearinghouse-gateway:vX.Y.Z          (the git tag)
#   tztcloud/livepeer-open-clearinghouse-gateway:latest          (only on tagged releases)
#   tztcloud/livepeer-open-clearinghouse-gateway:sha-<short>     (always)

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build + push multi-arch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tztcloud/livepeer-open-clearinghouse-gateway
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=livepeer-open-clearinghouse-gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
