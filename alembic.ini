# Alembic configuration for PymtHouse.
#
# The database URL is resolved from pymthouse.settings at runtime (so the
# sqlalchemy.url placeholder here is intentionally empty). See migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
output_encoding = utf-8
sqlalchemy.url =

# Use a single-line revision id format with a zero-padded sequential prefix
# (e.g. 0001_initial_schema). Easier to read and grep than autogenerated hashes.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC

[post_write_hooks]
hooks = ruff_format,ruff_check
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = console_scripts
ruff_check.entrypoint = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
