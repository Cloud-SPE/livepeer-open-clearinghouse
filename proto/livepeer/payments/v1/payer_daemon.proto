// Livepeer Payments v1 — PayerDaemon service.
//
// The PayerDaemon runs next to a payer application — a Livepeer gateway
// or any consumer app paying an orchestrator. It creates and signs
// tickets, manages per-session sender nonces, and watches the payer's
// on-chain escrow.
//
// Mounted only when the daemon is started with `--mode=sender`. Calls
// to it in receiver mode return UNIMPLEMENTED.
//
// This service is NOT part of the wire-compat contract; it is a
// daemon↔consumer-app contract that may evolve under v1. See
// `../docs/wire-compat.md`.

syntax = "proto3";

package livepeer.payments.v1;

import "livepeer/payments/v1/types.proto";

option go_package = "github.com/Cloud-SPE/livepeer-network-modules/livepeer-network-protocol/proto-go/livepeer/payments/v1;paymentsv1";

service PayerDaemon {
  // Create a payment blob (a `Payment` carrying one or more tickets)
  // for a selected payee identity against an accepted quote and funded
  // budget.
  //
  // The caller provides:
  //   1. the accepted quote identity and unit pricing basis
  //   2. the funded value / budget for this request or session
  //   3. the selected broker URL for ticket-params retrieval
  //
  // Sender mode then:
  //   1. POSTs the request context to the broker's
  //      `/v1/payment/ticket-params` endpoint.
  //   2. Receives canonical `TicketParams` back.
  //   3. Validates the funding request against sender escrow / EV caps.
  //   4. Signs a `Payment` whose wire `expected_price` reflects the
  //      accepted quote basis.
  //
  // The funded value is the caller's authorized budget, not a mandatory
  // winning-ticket size. The receiver may answer with a larger
  // `TicketParams.face_value` plus a lower `TicketParams.win_prob` when
  // redemption economics require a redeemable ticket. Senders MUST
  // treat the returned `TicketParams` as the source of truth and not
  // assume the returned winning-ticket face value equals the funded
  // value they requested.
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);

  // Report the payee-side outcome for a previously-minted payment. The
  // payer daemon uses this to invalidate cached session state when the
  // payee reports a machine-readable rejection such as
  // INVALID_RECIPIENT_RAND.
  rpc ReportPaymentResult(ReportPaymentResultRequest) returns (ReportPaymentResultResponse);

  // Inspect the payer's current TicketBroker deposit / reserve state.
  // Read-only; the daemon does not fund escrow.
  rpc GetDepositInfo(GetDepositInfoRequest) returns (GetDepositInfoResponse);

  // Deprecated: NOT the reconciliation source, and not implemented.
  //
  // The payer daemon keeps no debit ledger. Debits happen payee-side —
  // the broker debits its payee daemon as usage is claimed — so a payer
  // has nothing to report and this RPC returns UNIMPLEMENTED.
  //
  // Session usage is reconciled from the payee side instead:
  //
  //   - the signed settlement record (`Livepeer-Settlement`), carrying
  //     cumulative claimed and debited units, the billed value, and the
  //     session's rotation chain; or
  //   - a direct read of `GET {worker_url}/v1/settlement/{id}` when the
  //     record should not cross a customer-controlled SDK at all.
  //
  // `debited_units` there is the authoritative billing quantity. Two
  // ledgers is how two ledgers drift, so the payee's is the only one.
  rpc GetSessionDebits(GetSessionDebitsRequest) returns (GetSessionDebitsResponse);

  // Health returns "ok" if the daemon is ready to mint payments. The
  // gateway calls this once at startup.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message CreatePaymentRequest {
  // Recipient orchestrator identity (the on-chain payee address), 20
  // raw bytes.
  bytes recipient = 1;

  // Optional per-request broker origin the sender should query for
  // `POST /v1/payment/ticket-params`. Gateway-backed resolver flows set
  // this to the selected broker URL so the ticket-params source matches
  // the payee that will validate the payment. When empty, sender mode
  // may fall back to a configured default for single-broker/dev setups.
  string ticket_params_base_url = 2;

  // Accepted route/quote basis chosen by the gateway.
  AcceptedPrice accepted_price = 3;

  // Funding scope the gateway is authorizing for this minted payment batch.
  FundingIntent funding = 4;

  // Caller-supplied idempotency key for this mint intent. REQUIRED.
  //
  // Minting signs tickets against real deposit, so a retry after an
  // uncertain response must never mint a second batch. With this key the
  // daemon replays the exact original response — same payment_bytes,
  // same work_id, same values — and never re-signs.
  //
  // Namespace: the key is scoped to the daemon's own sender identity
  // (its keystore address). Two callers sharing one daemon share one
  // namespace, so ids MUST be globally unique within it — a UUIDv4, or a
  // caller-prefixed form like "loc:<uuid>". Max 128 bytes. A key reused
  // with different request content is refused (INVALID_ARGUMENT), never
  // minted: the key is a promise about content.
  //
  // A recovery retry after `ReportPaymentResult` reported
  // INVALID_RECIPIENT_RAND is a NEW intent and needs a NEW key: the old
  // one would replay the very payment the payee rejected. The rotation
  // mints against a fresh recipient rand, so it is a different payment
  // by construction.
  //
  // Lifecycle: the daemon keeps the full response for a retention window
  // (operator-configured, default 24h) and keeps a permanent tombstone of
  // the key beyond it. A retry arriving after the window is REFUSED with
  // FAILED_PRECONDITION, never treated as a fresh mint — an evicted key
  // must not become mintable again, or a sufficiently delayed retry
  // would double-pay. The tombstone is a hash, not the key, so retention
  // costs ~80 bytes per mint forever.
  string mint_request_id = 5;
}

message CreatePaymentResponse {
  // Wire-format `livepeer.payments.v1.Payment` bytes. The caller
  // attaches these to its app-level request to the payee (typically as
  // the `Livepeer-Payment` HTTP header value, base64-encoded).
  bytes payment_bytes = 1;

  // Number of tickets this payment carries (for metrics / audit).
  uint32 tickets_created = 2;

  // Aggregate expected value (EV = face_value × win_prob) committed by
  // this payment.
  BigUInt expected_value = 3;

  // Effective funded value used for the minted payment batch.
  BigUInt funded_value_wei = 4;

  // Quote identity serialized into the payment context.
  QuoteRef accepted_quote_ref = 5;

  // Work-id bound to this minted payment (hex recipient_rand_hash).
  string work_id = 6;

  // ---- encumbrance release ----

  // The round these tickets were minted in, the last round in which they
  // can currently still be redeemed, and the ticketValidityPeriod that
  // figure was computed from.
  //
  // READ THE NEXT PARAGRAPH BEFORE TREATING expires_after_round AS A
  // DEADLINE. It is a PREDICTION under the governance parameter observed
  // at mint, not an immutable property of the envelope.
  //
  // The TicketBroker checks, at redemption:
  //
  //     require(creationRound + ticketValidityPeriod > currentRound)
  //
  // reading ticketValidityPeriod from CURRENT storage, and the round
  // block hashes it also needs are kept in a permanent mapping. So
  // raising the parameter extends tickets already issued, and can revive
  // ones that had lapsed. A consumer that finalizes or refunds on
  // expires_after_round alone can be wrong about an envelope it already
  // acted on.
  //
  // ticket_validity_period is published so a consumer can DETECT that:
  // compare it against the chain's current value and you can see that a
  // deadline moved.
  //
  // Detect, not repair. Re-encumbering on an increase is not
  // implementable — credit already finalized or returned may have been
  // spent or withdrawn — so this is telemetry, and paid-job §5.3
  // describes the terminal outcomes that actually govern.
  //
  // expires_after_round is the LAST round the envelope can still be
  // redeemed in — creation_round + ticket_validity_period - 1 — so
  // "no longer redeemable" is exactly current_round > expires_after_round,
  // matching the contract's boundary rather than sitting a round beyond
  // it.
  int64 creation_round = 7;
  int64 expires_after_round = 8;
  int64 ticket_validity_period = 9;

  // When ticket_validity_period was read from the chain, RFC3339 with
  // nanoseconds.
  //
  // A payer may serve this from a short cache rather than reading the
  // contract inside every signing path. That makes the value "the
  // chain's, as of a moment", and the moment has to be stated or a
  // consumer cannot tell a current value from one governance changed a
  // second ago. Treat it as telemetry for detecting drift, not as
  // authority over anything.
  string ticket_validity_period_observed_at = 10;
}

message ReportPaymentResultRequest {
  // Work-id of the minted payment whose result is being reported.
  string work_id = 1;

  // Route metadata for observability / retry detail.
  string capability = 2;
  string offering = 3;

  // Rejection reason observed by the payee. UNSPECIFIED means the
  // payment was accepted and requires no sender-side action.
  PaymentRejectionReason rejection_reason = 4;
}

message ReportPaymentResultResponse {}

message GetSessionDebitsRequest {
  // Sender ETH address (20 raw bytes), echoed from the payment envelope.
  bytes sender = 1;

  // Work-id of the long-lived session: the hex-encoded
  // recipient_rand_hash the payee issued.
  //
  // An earlier comment here claimed this equals the value the broker
  // echoes in `Livepeer-Request-Id` at session open. It does not, and
  // never did — `Livepeer-Request-Id` is the caller's own idempotency
  // key and has no relationship to a payment identity.
  string work_id = 2;
}

message GetSessionDebitsResponse {
  // Total work units accrued across all interim debits for this
  // session. Zero when the daemon has no record of the session (or
  // when long-lived debit tracking is not wired and the daemon
  // returns the empty default).
  uint64 total_work_units = 1;

  // Number of interim debits the daemon recorded for this session.
  // Useful for diagnostics; the gateway-adapter does not act on it.
  uint64 debit_count = 2;

  // True when the session is closed (CloseSession was issued).
  bool closed = 3;
}

message GetDepositInfoRequest {}

message GetDepositInfoResponse {
  // Current on-chain deposit (wei, big-endian bytes).
  bytes deposit = 1;

  // Current on-chain reserve (wei, big-endian bytes).
  bytes reserve = 2;

  // If the payer has initiated an unlock, the round at which
  // withdrawal becomes possible. Zero when no unlock is pending.
  int64 withdraw_round = 3;

  // The payer's current round, read from the SAME clock that stamps
  // CreatePaymentResponse.creation_round.
  //
  // It is here so a consumer holding an encumbrance can evaluate
  // release against one clock rather than correlating two. The rule the
  // field exists for is
  //
  //     release iff current_round > expires_after_round
  //
  // with equality staying encumbered — a ticket minted in round R is
  // redeemable through R+window inclusive, so releasing at equality
  // releases while the envelope is still spendable.
  //
  // A consumer MUST also refuse to release on a missing, zero, or
  // REGRESSING value. A round that goes backwards means the payer's
  // clock lost state or is talking to a re-orged or lagging node, and a
  // stale round can only make an expired envelope look live — never the
  // reverse — so the safe reading of a suspect clock is "still
  // encumbered".
  int64 current_round = 4;

  // The chain's CURRENT ticketValidityPeriod, read fresh.
  //
  // Paired with the value a mint recorded, this is how a consumer
  // notices that governance moved the goalposts: an envelope minted when
  // the period was 2 and evaluated when it is 4 is redeemable two rounds
  // longer than its recorded deadline says.
  int64 ticket_validity_period = 5;

  // When that value was read. This RPC reads the contract fresh on every
  // call — it is an administrative query, not a signing path, so there
  // is no latency argument for caching and therefore no reason to make a
  // consumer reason about staleness here.
  string ticket_validity_period_observed_at = 6;
}

// HealthRequest / HealthResponse live in types.proto (shared with PayeeDaemon).
