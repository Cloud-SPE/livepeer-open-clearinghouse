# Livepeer Open Clearinghouse local + dev compose stack.
#
# - All services reference pre-built images via `image:` (no `build:` here).
#   Build the gateway locally with `make image-build` first.
# - Both daemons run in chain mode by default: payment-daemon signs against
#   an Arbitrum RPC and the V3 keystore at ./.dev/keystore/, service-
#   registry-daemon resolves orchestrators via the same chain RPC. Mirrors
#   the wiring in livepeer-modules-openai's docker-compose.yml. To revert
#   to the daemons' built-in dev keys, drop --chain-rpc and the keystore
#   mounts from payment-daemon (the daemon will use devkeystore.New()).
# - Shared `livepeer-run` named volume carries the UDS sockets between
#   the daemons and the gateway.
# - .dev/keystore is mounted read-only into payment-daemon at /etc/livepeer.

services:
  db:
    image: postgres:16-alpine
    container_name: livepeer-open-clearinghouse-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livepeer_open_clearinghouse}
      POSTGRES_USER: ${POSTGRES_USER:-livepeer_open_clearinghouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livepeer_open_clearinghouse-dev-password}
    volumes:
      - livepeer-open-clearinghouse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livepeer_open_clearinghouse}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped

  payment-daemon:
    image: tztcloud/livepeer-payment-daemon:${LIVEPEER_PAYER_DAEMON_TAG:-v1.3.0}
    container_name: livepeer-open-clearinghouse-payment-daemon
    command:
      - --mode=sender
      - --socket=/var/run/livepeer/payer-daemon.sock
      - --chain-rpc=${CHAIN_RPC:-https://arb1.arbitrum.io/rpc}
      - --keystore-path=/etc/livepeer/keystore.json
      - --keystore-password-file=/etc/livepeer/keystore-password
    user: "65532:65532"
    volumes:
      - livepeer-run:/var/run/livepeer
      # Mount the whole keystore directory read-only at /etc/livepeer.
      # Provide your own at ./.dev/keystore/ or override LIVEPEER_KEYSTORE_DIR.
      - ${LIVEPEER_KEYSTORE_DIR:-./.dev/keystore}:/etc/livepeer:ro
    restart: unless-stopped

  service-registry-daemon:
    image: tztcloud/livepeer-service-registry-daemon:${LIVEPEER_REGISTRY_DAEMON_TAG:-v1.3.0}
    container_name: livepeer-open-clearinghouse-service-registry-daemon
    command:
      - --mode=resolver
      - --socket=/var/run/livepeer/service-registry.sock
      - --chain-rpc=${CHAIN_RPC:-https://arb1.arbitrum.io/rpc}
    user: "65532:65532"
    volumes:
      - livepeer-run:/var/run/livepeer
      - registry-cache:/var/lib/livepeer
      # Optional operator overlay:
      # - ./.dev/registry/nodes.yaml:/etc/livepeer/nodes.yaml:ro
    restart: unless-stopped

  livepeer-open-clearinghouse-gateway:
    image: tztcloud/livepeer-open-clearinghouse-gateway:${OPEN_CLEARINGHOUSE_GATEWAY_TAG:-dev}
    container_name: livepeer-open-clearinghouse-gateway
    depends_on:
      db:
        condition: service_healthy
      payment-daemon:
        condition: service_started
      service-registry-daemon:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://livepeer_open_clearinghouse:livepeer_open_clearinghouse-dev-password@db:5432/livepeer_open_clearinghouse}
      API_KEY_HASH_PEPPER: ${API_KEY_HASH_PEPPER:-dev-pepper-CHANGE-FOR-PROD}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-CHANGE-FOR-PROD}
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token-CHANGE-FOR-PROD}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-dev-admin-bootstrap-CHANGE-FOR-PROD}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-auto}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_URL: ${RESEND_API_URL:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@livepeer-open-clearinghouse.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Livepeer Open Clearinghouse}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      PAYMENT_DAEMON_MODE: ${PAYMENT_DAEMON_MODE:-mock}
      PAYMENT_DAEMON_SOCKET: /var/run/livepeer/payer-daemon.sock
      REGISTRY_DAEMON_MODE: ${REGISTRY_DAEMON_MODE:-mock}
      REGISTRY_DAEMON_SOCKET: /var/run/livepeer/service-registry.sock
      REGISTRY_CACHE_TTL_SECONDS: ${REGISTRY_CACHE_TTL_SECONDS:-60}
      DEFAULT_INITIAL_CREDIT_WEI: ${DEFAULT_INITIAL_CREDIT_WEI:-0}
      DEFAULT_SPEND_PERIOD_SECONDS: ${DEFAULT_SPEND_PERIOD_SECONDS:-86400}
      DEFAULT_SPEND_PERIOD_CAP_WEI: ${DEFAULT_SPEND_PERIOD_CAP_WEI:-0}
      AUTO_REPLENISH_INCREMENT_WEI: ${AUTO_REPLENISH_INCREMENT_WEI:-0}
      AUTO_REPLENISH_CHECK_INTERVAL_SECONDS: ${AUTO_REPLENISH_CHECK_INTERVAL_SECONDS:-300}
      IDEMPOTENCY_INFLIGHT_TIMEOUT_SECONDS: ${IDEMPOTENCY_INFLIGHT_TIMEOUT_SECONDS:-60}
      SESSION_RECONCILIATION_INTERVAL_SECONDS: ${SESSION_RECONCILIATION_INTERVAL_SECONDS:-60}
    volumes:
      - livepeer-run:/var/run/livepeer
    ports:
      - "${OPEN_CLEARINGHOUSE_HOST_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  livepeer-open-clearinghouse-pgdata:
  livepeer-run:
  registry-cache:
