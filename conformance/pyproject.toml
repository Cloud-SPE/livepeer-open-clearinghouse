[project]
name = "loc-conformance"
version = "0.1.0"
description = "Cross-language LOC + broker conformance harness."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["runners/python"]
addopts = ["--strict-markers"]
