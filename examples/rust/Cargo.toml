[package]
name = "pymthouse-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Reference Rust SDK for the PymtHouse payment clearinghouse."
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "example"
path = "examples/example.rs"

[profile.release]
opt-level = 3
lto = "thin"
